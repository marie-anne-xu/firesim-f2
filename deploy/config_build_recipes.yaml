# Build-time build recipe configuration for the FireSim Simulation Manager
# See https://docs.fires.im/en/stable/Advanced-Usage/Manager/Manager-Configuration-Files.html for documentation of all of these params.

# this file contains sections that describe hardware designs that /can/ be built.
# edit config_build.yaml to actually "turn on" a config to be built when you run
# buildbitstream

###########
# Schema:
###########
# <NAME>:
#    PLATFORM: <string>
#    TARGET_PROJECT: <string>
#    TARGET_PROJECT_MAKEFRAG: <string | null>
#    DESIGN: <string>
#    TARGET_CONFIG: <string>
#    PLATFORM_CONFIG: <string>
#    deploy_quintuplet: <string | null>
#    platform_config_args:
#       fpga_frequency: <int>
#       build_strategy: <string>
#    post_build_hook: <string | null>
#    metasim_customruntimeconfig: <string | null>
#    bit_builder_recipe: <string>
#    # OPTIONAL: overrides for bit builder recipe
#    # Arg structure should be identical to the args given
#    # in the base_recipe.
#    #bit_builder_arg_overrides:
#    #  <ARG>: <OVERRIDE>

# MIDAS Examples -- BUILD SUPPORT ONLY; Can't launch driver correctly on run farm
midasexamples_gcd:
    PLATFORM: f2
    TARGET_PROJECT: midasexamples
    TARGET_PROJECT_MAKEFRAG: null
    DESIGN: GCD
    TARGET_CONFIG: NoConfig
    PLATFORM_CONFIG: DefaultF2Config
    deploy_quintuplet: null
    platform_config_args:
        fpga_frequency: 75
        build_strategy: TIMING
    post_build_hook: null
    metasim_customruntimeconfig: null
    bit_builder_recipe: bit-builder-recipes/f2.yaml

firesim_mega_boom:
    PLATFORM: f2
    TARGET_PROJECT: firesim 
    TARGET_PROJECT_MAKEFRAG: ../../../generators/firechip/chip/src/main/makefrag/firesim
    DESIGN: FireSim
    TARGET_CONFIG: WithDefaultFireSimBridges_WithFireSimHighPerfConfigTweaks_chipyard.MegaBoomV3Config
    PLATFORM_CONFIG: DefaultF2Config
    deploy_quintuplet: null
    platform_config_args:
        fpga_frequency: 35
        build_strategy: TIMING
    post_build_hook: null
    metasim_customruntimeconfig: null
    bit_builder_recipe: bit-builder-recipes/f2.yaml

# =============================================================================
# Nested-DFX experiment (C1): declare the prefetcher as a REAL nested RP inside
# AWS's WRAPPER/CL (which is itself HD.RECONFIGURABLE), via pr_subdivide.
#   TARGET_CONFIG = FireSimDfxBestOffsetPrefetchingMegaBoomV3Config -> emits the
#   STABLE OUTER WRAPPER module `ReconfigurablePrefetcher` (fixed 323-pin PrefetcherIO,
#   real inner sub-Module) around a BestOffset inner. This is the exact config the
#   pr_subdivide structural probe passed on and the config of the booting nopr base.
#   pr_module_name = ReconfigurablePrefetcher (NOT the inner EvolvedPrefetcher/BestOffset).
#   No pr_base_recipe => PARENT flow: pass1 stock build + pass2 pr_subdivide, then the
#   nested base DCP is packaged directly to AWS bitgen (build-bitstream.sh parent branch).
# Goal: empirically test whether AWS create-fpga-image accepts a nested
#   HD.RECONFIGURABLE_CONTAINER topology and produces a BOOTING AFI.
dfx_nested_bestoffset_base:
    PLATFORM: f2
    TARGET_PROJECT: firesim
    TARGET_PROJECT_MAKEFRAG: ../../../generators/firechip/chip/src/main/makefrag/firesim
    DESIGN: FireSim
    TARGET_CONFIG: FireSimDfxBestOffsetPrefetchingMegaBoomV3Config
    PLATFORM_CONFIG: DefaultF2Config
    deploy_quintuplet: null
    platform_config_args:
        fpga_frequency: 35
        build_strategy: TIMING
        enable_pr: true
        pr_module_name: ReconfigurablePrefetcher
    post_build_hook: null
    metasim_customruntimeconfig: null
    bit_builder_recipe: bit-builder-recipes/f2.yaml

# Partial reconfiguration pair. The only difference is pr_base_recipe: its
# presence selects the child (RM swap) flow, its absence the parent (base) flow.
# Loop: build the base once, edit EvolvedPrefetcher.scala, build the child.

evolved_prefetch_base:
    PLATFORM: f2
    TARGET_PROJECT: firesim
    TARGET_PROJECT_MAKEFRAG: ../../../generators/firechip/chip/src/main/makefrag/firesim
    DESIGN: FireSim
    TARGET_CONFIG: WithDefaultFireSimBridges_WithFireSimHighPerfConfigTweaks_chipyard.FireSimEvolvedPrefetchingMegaBoomV3BaseConfig
    PLATFORM_CONFIG: DefaultF2Config
    deploy_quintuplet: null
    platform_config_args:
        fpga_frequency: 35
        build_strategy: TIMING
        enable_pr: true
        pr_module_name: EvolvedPrefetcher
    post_build_hook: null
    metasim_customruntimeconfig: null
    bit_builder_recipe: bit-builder-recipes/f2.yaml

# Must match evolved_prefetch_base exactly apart from pr_base_recipe -- the
# static region is inherited from the base build's locked checkpoint.
evolved_prefetch_child:
    PLATFORM: f2
    TARGET_PROJECT: firesim
    TARGET_PROJECT_MAKEFRAG: ../../../generators/firechip/chip/src/main/makefrag/firesim
    DESIGN: FireSim
    TARGET_CONFIG: WithDefaultFireSimBridges_WithFireSimHighPerfConfigTweaks_chipyard.FireSimEvolvedPrefetchingMegaBoomV3BaseConfig
    PLATFORM_CONFIG: DefaultF2Config
    deploy_quintuplet: null
    platform_config_args:
        fpga_frequency: 35
        build_strategy: TIMING
        enable_pr: true
        pr_module_name: EvolvedPrefetcher
        pr_base_recipe: evolved_prefetch_base
    post_build_hook: null
    metasim_customruntimeconfig: null
    bit_builder_recipe: bit-builder-recipes/f2.yaml


